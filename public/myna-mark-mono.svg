<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 96" fill="currentColor" role="img" aria-label="Myna">
  <title>Myna</title>
  <!--
    Illustrator-style construction:
    • Circle = head
    • Triangle = beak (base overlaps head → one solid mass)
    • Eye punched via mask (not evenodd — evenodd holes the overlap)
  -->
  <defs>
    <mask id="myna-eye" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="96">
      <rect width="112" height="96" fill="#fff"/>
      <circle cx="54" cy="40" r="6" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#myna-eye)">
    <circle cx="40" cy="48" r="36"/>
    <polygon points="62,36 110,48 62,60"/>
  </g>
</svg>
